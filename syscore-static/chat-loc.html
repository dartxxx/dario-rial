  precios: () => `Nuestos precios de referencia:

  default: (msg) => {

function classify(msg) {
  const lower = msg.toLowerCase();
  if (lower.match(/hola|buenas|buenos|buen dia|como estas|que tal/)) return 'hola';
  if (lower.match(/servici|que hacen|que ofrecen|que venden|tienen/)) return 'servicios';
  if (lower.match(/precio|costo|cuanto|cuanta|presupuesto|cotiz/)) return 'precios';
  if (lower.match(/sitio web|pagina web|landing|e-commerce|disen|web /)) return 'sitio_web';
  if (lower.match(/diseno web|diseno/)) return 'diseno_web';
  if (lower.match(/red |redes|lan|wan|router|wifi|conectar|cableado|topologia/)) return 'redes';
  if (lower.match(/inteligencia artificial|ia |chatbot|gpt|llm|openai|machine learning|nlp/)) return 'ia';
  if (lower.match(/automatiz|whatsapp|bot |rpa|zapier|workflow/)) return 'automatizacion';
  if (lower.match(/whatsapp bot|bot whatsapp|bot de whatsapp/)) return 'whatsapp';
  if (lower.match(/segur|firewall|pentest|proteccion|hack|ataque|virus/)) return 'seguridad';
  if (lower.match(/soport|mantenimiento|ayuda|help|asistenc/)) return 'soporte';
  if (lower.match(/equipo|comput|laptop|pc |notebook|servidor|periferic|licencia/)) return 'equipos';
  if (lower.match(/contact|hablar|llamar|whatsapp|escribir|comunicar/)) return 'contacto';
  return 'default';
}

function getResponse(msg) {
  const intent = classify(msg);
  let response = KNOWLEDGE[intent](msg);
  if (intent === 'contacto') {
    response = 'Pod&eacute;s contactar a Dario directamente por WhatsApp: <strong>+54 9 3705 000427</strong> (responde en menos de 1 hora) o por email: <strong>dar.riall@gmail.com</strong>. &#191;Te paso el WhatsApp ahora?';
  }
  return response;
}

function sendMsg() {
  const inp = document.getElementById('inp');
  const text = inp.value.trim();
  if (!text) return;
  inp.value = '';
  inp.style.height = 'auto';
  addMsg(text, 'user');
  ctx.push({ role: 'user', content: text });
  const reply = getResponse(text);
  addMsg(reply, 'bot', true);
  ctx.push({ role: 'assistant', content: reply });
}

function sendQuick(topic) {
  document.getElementById('inp').value = topic;
  sendMsg();
}

function kh(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMsg();
  }
}

function addMsg(text, type, withCta) {
  const chat = document.getElementById('chat');
  const d = document.createElement('div');
  d.className = 'msg ' + type;
  const who = document.createElement('div');
  who.className = 'who';
  who.textContent = type === 'bot' ? 'Juan \u00b7 SysCoreTech' : 'Vos';
  const b = document.createElement('div');
  b.className = 'bubble';
  b.innerHTML = text;
  d.appendChild(who);
  d.appendChild(b);
  if (type === 'user') {
    const qrs = chat.querySelector('.qrs');
    if (qrs) qrs.remove();
  }
  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
}
</script>
