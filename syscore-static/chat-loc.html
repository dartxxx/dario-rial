<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SysCoreTech Chat</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Inter,sans-serif;background:#030712;color:#f3f4f6;min-height:100vh;display:flex;flex-direction:column}
header{background:linear-gradient(135deg,#6366f1,#a855f7);padding:20px;text-align:center}
header h1{font-size:18px;font-weight:700}
header p{font-size:12px;opacity:0.8}
#chat{flex:1;max-width:600px;margin:0 auto;width:100%;padding:20px;overflow-y:auto;display:flex;flex-direction:column;gap:12px}
.msg{display:flex;gap:10px;align-items:flex-end;max-width:85%}
.msg.user{flex-direction:row-reverse;align-self:flex-end}
.msg .bubble{padding:12px 16px;border-radius:16px;font-size:14px;line-height:1.5}
.msg.bot .bubble{background:rgba(30,41,59,0.9);border-bottom-left-radius:4px}
.msg.user .bubble{background:linear-gradient(135deg,#6366f1,#a855f7);border-bottom-right-radius:4px}
.msg .who{font-size:10px;opacity:0.6;margin-bottom:4px}
.msg.bot .who{color:#a855f7}
.msg.user .who{color:#06b6d4;text-align:right}
.typing .bubble{display:flex;gap:4px;align-items:center;padding:14px 18px}
.typing .bubble span{width:6px;height:6px;background:rgba(255,255,255,0.5);border-radius:50%;animation:tdot 1.2s infinite}
.typing .bubble span:nth-child(2){animation-delay:.2s}
.typing .bubble span:nth-child(3){animation-delay:.4s}
@keyframes tdot{0%,100%{transform:translateY(0);opacity:.5}50%{transform:translateY(-5px);opacity:1}}
.input-area{padding:16px 20px;background:rgba(15,23,42,0.8);border-top:1px solid rgba(99,102,241,0.15);display:flex;gap:10px;max-width:600px;margin:0 auto;width:100%}
.input-area textarea{flex:1;background:rgba(30,41,59,0.8);border:1px solid rgba(99,102,241,0.2);border-radius:12px;padding:12px 16px;color:white;font-size:14px;resize:none;max-height:100px;font-family:Inter,sans-serif;outline:none}
.input-area textarea:focus{border-color:rgba(99,102,241,0.5)}
.send-btn{width:46px;height:46px;background:linear-gradient(135deg,#6366f1,#a855f7);border-radius:12px;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.send-btn svg{width:18px;height:18px;color:white}
#status{text-align:center;font-size:11px;padding:8px;background:rgba(99,102,241,0.1);color:#a5b4fc}
.hidden{display:none}
</style>
</head>
<body>
<header>
  <h1>SysCoreTech · Juan, Asesor Virtual</h1>
  <p>IA local · Tu consulta es 100% privada</p>
</header>
<div id="status">Cargando modelo IA...</div>
<div id="chat"></div>
<div class="input-area">
  <textarea id="input" rows="1" placeholder="Escribí tu mensaje..." onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();send()}"></textarea>
  <button class="send-btn" onclick="send()">
    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"/></svg>
  </button>
</div>

<script type="module">
import { pipeline, env } from 'https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.1';

env.allowLocalModels = false;
env.useBrowserCache = true;

const SYSTEM = `Eres Juan, asesor de ventas de SysCoreTech. Solo hablas español argentino, directo y cercano. Servicios: 1)Diseno Web (desde $350 USD), 2)Integracion de IA (desde $500 USD), 3)Redes corporativas (desde $400 USD), 4)Automatizacion (desde $300 USD), 5)Seguridad Informatica (desde $300 USD), 6)Soporte 24/7 ($200 USD/mes), 7)Gestion proyectos IT, 8)Equipos informaticos. Director:Dario Rial. Contacto: +54 9 3705 000427, dar.riall@gmail.com. IMPORTANTE: No menciones El Colorado como municipalidad. Cierra siempre con WhatsApp ante interes.`;

// Use a small model that runs in browser - Xenova/TinyLlama or SmolLM2
// 1.1B params - runs on WebGPU in browser
let chatPipeline = null;

async function loadModel() {
  try {
    chatPipeline = await pipeline('text-generation', 'Xenova/TinyLlama-1.1B-Chat-v1.0', {
      device: 'webgpu',
      progress_callback: (p) => {
        const s = document.getElementById('status');
        if (p.status === 'progress') {
          s.textContent = `Descargando modelo... ${Math.round(p.progress || 0)}%`;
        }
      }
    });
    document.getElementById('status').textContent = 'IA lista. Chateá ahora!';
    document.getElementById('status').style.background = 'rgba(34,197,94,0.1)';
    document.getElementById('status').style.color = '#86efac';
    setTimeout(() => document.getElementById('status').classList.add('hidden'), 2000);
  } catch (e) {
    document.getElementById('status').textContent = 'Error cargando IA. Recargá la pagina.';
    console.error(e);
  }
}

const hist = [];
window.send = async function() {
  const inp = document.getElementById('input');
  const text = inp.value.trim();
  if (!text || !chatPipeline) return;
  inp.value = '';

  addMsg(text, 'user');
  hist.push({ role: 'user', content: text });

  showTyping();

  try {
    // Build messages for TinyLlama chat format
    const messages = [{ role: 'system', content: SYSTEM }];
    hist.forEach(m => messages.push(m));

    const out = await chatPipeline(messages, {
      max_new_tokens: 256,
      temperature: 0.7,
      do_sample: true,
      repetition_penalty: 1.1
    });

    rmTyping();
    const reply = out[0]?.generated_text?.content || out[0]?.generated_text || 'No pude generar respuesta.';
    addMsg(reply, 'bot');
    hist.push({ role: 'assistant', content: reply });
  } catch (e) {
    rmTyping();
    addMsg('Error: ' + e.message, 'bot');
  }
};

function addMsg(text, type) {
  const chat = document.getElementById('chat');
  const d = document.createElement('div');
  d.className = 'msg ' + type;
  const who = document.createElement('div');
  who.className = 'who';
  who.textContent = type === 'bot' ? 'Juan · SysCoreTech' : 'Vos';
  const b = document.createElement('div');
  b.className = 'bubble';
  b.textContent = text;
  d.appendChild(b);
  d.insertBefore(who, b);
  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
}

function showTyping() {
  const chat = document.getElementById('chat');
  const d = document.createElement('div');
  d.className = 'msg bot typing';
  d.id = 'typing';
  const b = document.createElement('div');
  b.className = 'bubble';
  b.innerHTML = '<span></span><span></span><span></span>';
  d.appendChild(b);
  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
}

function rmTyping() {
  const t = document.getElementById('typing');
  if (t) t.remove();
}

loadModel();
</script>
</body>
</html>
